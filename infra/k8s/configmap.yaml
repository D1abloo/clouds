apiVersion: v1
kind: ConfigMap
metadata:
  name: cloudops-config
  namespace: cloudops
data:
  NODE_ENV: production
  LOG_LEVEL: info
  CORS_ORIGIN: https://cloudops.example.com
  API_PREFIX: api/v1
  REDIS_URL: redis://redis:6379
  PROMETHEUS_URL: http://prometheus:9090
  JENKINS_URL: http://jenkins:8080
  VAULT_ADDR: http://vault:8200
  WORKERS_DISCOVERY_INTERVAL_MS: "60000"
  WORKERS_METRICS_INTERVAL_MS: "30000"
  WORKERS_BILLING_SYNC_INTERVAL_MS: "3600000"
