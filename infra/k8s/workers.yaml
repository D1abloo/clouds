apiVersion: apps/v1
kind: Deployment
metadata:
  name: workers
  namespace: cloudops
spec:
  replicas: 1
  selector:
    matchLabels:
      app: workers
  template:
    metadata:
      labels:
        app: workers
    spec:
      containers:
        - name: workers
          image: ghcr.io/your-org/cloudops-workers:latest
          envFrom:
            - configMapRef:
                name: cloudops-config
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cloudops-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: cloudops-config
                  key: REDIS_URL
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            exec:
              command: ["node", "-e", "process.exit(0)"]
            initialDelaySeconds: 15
            periodSeconds: 30
---
apiVersion: v1
kind: Service
metadata:
  name: workers
  namespace: cloudops
spec:
  clusterIP: None
  selector:
    app: workers
  ports:
    - port: 80
      targetPort: 80
