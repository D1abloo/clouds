# Example secrets — DO NOT commit real values.
# Copy to secrets.yaml (gitignored) or use Sealed Secrets / External Secrets Operator.
#
# kubectl create secret generic cloudops-secrets -n cloudops \
#   --from-literal=database-url='postgresql://user:pass@postgres:5432/cloudops' \
#   --from-literal=jwt-secret='change-me' \
#   --dry-run=client -o yaml > secrets.yaml

apiVersion: v1
kind: Secret
metadata:
  name: cloudops-secrets
  namespace: cloudops
type: Opaque
stringData:
  database-url: postgresql://cloudops:CHANGE_ME@postgres:5432/cloudops
  jwt-secret: CHANGE_ME_USE_openssl_rand_base64_32
  jwt-refresh-secret: CHANGE_ME
  vault-token: CHANGE_ME
  aws-access-key-id: ""
  aws-secret-access-key: ""
  gcp-service-account-json: ""
  azure-client-secret: ""
