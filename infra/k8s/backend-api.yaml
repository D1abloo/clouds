apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-api
  namespace: cloudops
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend-api
  template:
    metadata:
      labels:
        app: backend-api
    spec:
      containers:
        - name: backend-api
          image: ghcr.io/your-org/cloudops-backend:latest
          ports:
            - containerPort: 3000
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cloudops-secrets
                  key: database-url
            - name: REDIS_URL
              value: redis://redis:6379
---
apiVersion: v1
kind: Service
metadata:
  name: backend-api
  namespace: cloudops
spec:
  selector:
    app: backend-api
  ports:
    - port: 80
      targetPort: 3000
