# Producción PRO — sin demo, sin puertos DB expuestos
# Uso: docker compose -f docker-compose.yml -f docker-compose.production.yml --env-file .env up -d --build

services:
  postgres:
    ports: []

  redis:
    ports: []

  backend-api:
    environment:
      NODE_ENV: production
      APP_ENV: production
      DEMO_MODE: "false"
      PRO_MODE: "true"
      AUTO_DEMO_SEED: "false"
      INTEGRATIONS_LIVE: "true"
      LOG_LEVEL: info
      CONTACT_INBOX: info@spendlyx.com
    env_file:
      - .env

  frontend:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./certs:/etc/nginx/certs:ro
      - ./docker/nginx-frontend-ssl.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/nginx-health"]
      interval: 30s
      timeout: 5s
      retries: 3
