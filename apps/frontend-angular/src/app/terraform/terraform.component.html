<div class="page-container tf-page tf-page--flat tf-page--fullscreen tf-page--in-layout animate-fade-in">
  @if (loading()) {
    <app-loading-state message="Cargando proyectos y workspaces…" />
  } @else {
    <div
      class="tf-body tf-body--fill tf-body--studio"
      [class.tf-body--no-inspector]="hubTab() === 'launches'"
    >
      <app-terraform-overview
        class="tf-body__overview"
        [summary]="summary()"
        [providers]="providerChips()"
        [projectsCount]="projects().length"
        [automationsCount]="automations().length"
        [activeProjectName]="activeProject()?.name ?? ''"
        (reviewPlans)="focusInspector()"
        (newProject)="openCreateProject()"
        (saveProject)="handleSaveProject()"
        (openAutomate)="setHubTab('automate')"
        (openDeploy)="setHubTab('deploy')"
        (openLaunches)="setHubTab('launches')"
      />

      <app-terraform-launch-progress [progress]="runStore.launchProgress()" />

      <div class="tf-shell tf-shell--studio">
        <div class="tf-rail tf-panel">
          <app-terraform-rail-panel
            [projects]="projects()"
            [activeProjectId]="activeProjectId()"
            [workspaces]="filteredWorkspaces()"
            [launches]="runStore.launches()"
            [activeWorkspaceId]="runStore.activeWorkspaceId()"
            [searchTerm]="wsSearchTerm() ?? ''"
            [search]="wsSearch"
            [expandedFolderIds]="expandedFolders()"
            [launchCount]="runStore.launches().length"
            (newProject)="openCreateProject()"
            (saveProject)="handleSaveProject()"
            (openAutomate)="setHubTab('automate')"
            (openLaunch)="openLaunch()"
            (projectSelect)="selectProject($event)"
            (toggleFolder)="handleToggleFolder($event)"
            (workspaceSelect)="selectWorkspace($event)"
            (launchSelect)="handleLaunchFromTree($event)"
            (loadTemplate)="loadTemplate($event)"
          />
        </div>

        <section class="tf-main tf-hub tf-hub--flat" aria-label="Centro de trabajo Terraform">
          <app-terraform-workspace-hub
            [activeTab]="hubTab()"
            [launchDetails]="launchDetails()"
            [selectedLaunchId]="selectedLaunchId()"
            [selectedLaunch]="selectedLaunch()"
            [activeProject]="activeProject()"
            [automations]="projectAutomations()"
            [deployments]="deployments()"
            [workspaceName]="workspaceName()"
            [workspaceProvider]="activeWorkspace()?.provider ?? 'AWS'"
            [workspaceStatus]="activeWorkspace()?.status ?? 'idle'"
            [editorHcl]="editorHcl()"
            [terminalLines]="terminalLines()"
            [terminalHeight]="terminalHeight()"
            [busy]="busy()"
            [hasPlan]="hasPlan()"
            [actionsDisabled]="actionsDisabled()"
            [providerConnected]="activeProviderConnected()"
            [showDestroyConfirm]="showDestroyConfirm()"
            [destroyConfirm]="destroyConfirm()"
            [planOutput]="planOutput() ?? ''"
            [activeRunId]="runStore.activeRunId() ?? ''"
            [planResources]="planResources()"
            [lineClassFn]="lineClass"
            (tabChange)="setHubTab($event)"
            (runInit)="runInit()"
            (runPlan)="runPlan()"
            (runApply)="runApply()"
            (toggleDestroy)="toggleDestroy()"
            (runDestroy)="runDestroy()"
            (editorChange)="onEditorChange($event)"
            (resizeTerminal)="startResize($event)"
            (clearTerminal)="runStore.clearTerminal()"
            (destroyConfirmChange)="destroyConfirm.set($event)"
            (saveProject)="handleSaveProject()"
            (environmentSelect)="selectProjectEnvironment($event)"
            (createAutomation)="handleCreateAutomation()"
            (toggleAutomation)="handleToggleAutomation($event)"
            (deploymentSelect)="handleDeploymentSelect($event)"
            (launchSelect)="handleLaunchSelect($event)"
            (openLaunch)="openLaunch()"
          />
        </section>
      </div>

      @if (hubTab() !== 'launches') {
      <div class="tf-inspector-row tf-panel" #inspectorPane>
        <div class="tf-inspector tf-panel-inner">
          <app-terraform-inspector-panel
            [activeProject]="activeProject()"
            [automations]="projectAutomations()"
            [planOutput]="planOutput() ?? ''"
            [runId]="runStore.activeRunId() ?? ''"
            [planResources]="planResources()"
            [statePreview]="statePreview()"
            (saveProject)="handleSaveProject()"
            (viewAutomate)="setHubTab('automate')"
          />
        </div>
      </div>
      }
    </div>
  }

  <app-run-detail-drawer
    [open]="drawerOpen()"
    [run]="selectedRun()"
    [planOutput]="drawerPlan()"
    [logs]="drawerLogs()"
    (close)="closeDrawer()"
  />
</div>
